spring.application.name=event-inquiry-api

# Supabase PostgreSQL Database Configuration (with SSL mode)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://aws-1-ap-northeast-2.pooler.supabase.com:6543/postgres?sslmode=require}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.lgtuzoikghhellyxvhqj}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:AnkitaMukherjee@12345}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# SQL Schema Initialization (Handled by Supabase migration)
spring.sql.init.mode=never

# Server Configuration (Supports Railway PORT environment variable & Forwarded HTTPS Headers)
server.port=${PORT:8081}
server.servlet.context-path=/
server.forward-headers-strategy=framework

# JWT Security Token Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Swagger UI / OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# Actuator Endpoint Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Logging Configuration
logging.level.root=INFO
logging.level.com.eventmanagement.api=DEBUG
